<html>
<head>
<title>JIMMY EAT WORLD</title>
<script language="JavaScript">

function openpopup(inDir){
	var strTest = "street_pop.html";
	
window.open(strTest,"","status=no,toolbar=no,directories=no,menubar=no,width=300,height=250,screenx=400,screeny=300,left=400,top=300")
}

function get_cookie(Name){
	var search = Name + "="
	var returnvalue = "";
	if (document.cookie.length > 0){
		offset = document.cookie.indexOf(search)
		if (offset != -1) { // if cookie exists
			offset += search.length
			// set index of beginning of value
			end = document.cookie.indexOf(";", offset);
			// set index of end of cookie value
			if (end == -1)
				end = document.cookie.length;
	
returnvalue=unescape(document.cookie.substring(offset, end))
		}
	}
	return returnvalue;
}

function loadpopup(inDir){
	if (get_cookie('popped')==''){
	openpopup(inDir)
	document.cookie="popped=yes"
	}
}

</script>
