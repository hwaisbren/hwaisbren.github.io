        body {
            /* Fallbacks are added in case a device doesn't have Arial loaded */
            font-family: Arial, Helvetica, sans-serif; 
/* Gallery Grid Layout */
.gallery {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  padding: 20px;
}

.gallery img {
  width: 200px;
  height: 150px;
  object-fit: cover;
  cursor: pointer;
  transition: transform 0.2s;
}

.gallery img:hover {
  transform: scale(1.05); /* Slight pop effect on hover */
}

/* The Lightbox Background Overlay */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(252, 252, 252, 0.9);
  justify-content: center;
  align-items: center;
}

/* The Enlarged Image */
.modal-content {
  max-width: 90%;
  max-height: 80%;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

#lightbox {
  display: none; /* Changed to flex via JavaScript */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(255, 255, 255, 0.9);
  
  /* Flexbox alignment */
  flex-direction: column;   /* Stacks the image and text vertically */
  justify-content: center;  /* Centers the stack vertically on the screen */
  align-items: center;      /* Centers the stack horizontally on the screen */
  z-index: 1000;
}

#lightbox-img {
  max-width: 80%;
  max-height: 70%;
  object-fit: contain;
}

#lightbox-caption {
  color: #000000;              /* Makes the text white so it's readable */
  font-size: 1.2rem;
  margin-top: 15px;         /* Creates breathing room between image and text */
  text-align: center;       /* Centers the text lines if it wraps */
  width: 80%;               /* Prevents the text from stretching wider than the image */
}
/* Close Button */
.close-btn {

    display: flex;
justify-content: center; /* Horizontally centers the text */
align-items: center;     /* Vertically centers the text */
height: 100%;            /* Ensure the container has a height to center within */
    
position: absolute;
  top: 20px;
  right: 35px;
  width: 40px;
  height: 40px;
  padding: 0;
  
  background-color: #c0c0c0;
  color: #000000;
  
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  
  font-family: 'Courier New', Courier, monospace;
  font-weight: bold;
  font-size: 20px;
  line-height: 20px;
  text-align: center;
  vertical-align: -80%;
  
  border-radius: 0;
  cursor: pointer;
  outline: none;
}
        }

<script> function openLightbox(thumbnail) {
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxCaption = document.getElementById("lightbox-caption"); // 1. Target the caption element
  
  // Set the source and alt text of the big image
  lightboxImg.src = thumbnail.src; 
  lightboxImg.alt = thumbnail.alt; // 2. Copy alt text to the big image for accessibility
  
  // Set the visible caption text to match the alt text
  lightboxCaption.textContent = thumbnail.alt; // 3. Display the text on screen
  
  // Change display from 'none' to 'flex' to show it
  lightbox.style.display = "flex"; 
}

function closeLightbox() {
  // Hide the lightbox when clicking anywhere on the overlay or close button
  document.getElementById("lightbox").style.display = "none";
}</script>
