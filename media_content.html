        body {
            
            font-family: Arial, Helvetica, sans-serif; 
/* grid layout */
.gallery {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  padding: 20px;
}

.gallery img {
  width: 200px;
  height: 150px;
  object-fit: cover;
  cursor: pointer;
  transition: transform 0.2s;
}

.gallery img:hover {
  transform: scale(1.05); /* hover fx */
}

/* bg overlay */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(252, 252, 252, 0.9);
  justify-content: center;
  align-items: center;
}

/* big img */
.modal-content {
  max-width: 90%;
  max-height: 80%;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

#lightbox {
  display: none; /* Changed to flex thru JavaScript */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(255, 255, 255, 0.9);
  
  /* enlarged img caption */
  flex-direction: column;  
  justify-content: center; 
  align-items: center;     
  z-index: 1000;
}

#lightbox-img {
  max-width: 80%;
  max-height: 70%;
  object-fit: contain;
}

#lightbox-caption {
  color: #000000;             
  font-size: 1.2rem;
  margin-top: 15px;         
  text-align: center;       
  width: 80%;              
}
/* Close Button */
.close-btn {

    display: flex;
justify-content: center; 
align-items: center;     
height: 100%;            
    
position: absolute;
  top: 20px;
  right: 35px;
  width: 40px;
  height: 40px;
  padding: 0;
  
  background-color: #c0c0c0;
  color: #000000;
  
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  
  font-family: 'Courier New', Courier, monospace;
  font-weight: bold;
  font-size: 20px;
  line-height: 20px;
  text-align: center;
  vertical-align: -80%;
  
  border-radius: 0;
  cursor: pointer;
  outline: none;
}
        }

<script> function openLightbox(thumbnail) {
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxCaption = document.getElementById("lightbox-caption"); //gets caption from alt text
  
  
  lightboxImg.src = thumbnail.src; 
  lightboxImg.alt = thumbnail.alt; 
  
  
  lightboxCaption.textContent = thumbnail.alt; 
  
  
  lightbox.style.display = "flex"; 
}

function closeLightbox() {
  // hides lightbox when clicked anywhere
  document.getElementById("lightbox").style.display = "none";
}</script>
