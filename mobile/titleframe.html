<html>
<head>
    <title>Header</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

    <script>
        function openpopup(inDir) {
            var strTest = "street_pop.html";

            window.open(
                strTest,
                "",
                "status=no,toolbar=no,directories=no,menubar=no,width=300,height=250,screenx=400,screeny=300,left=400,top=300"
            );
        }

        function get_cookie(Name) {
            var search = Name + "=";
            var returnvalue = "";

            if (document.cookie.length > 0) {
                var offset = document.cookie.indexOf(search);

                if (offset != -1) {
                    offset += search.length;

                    var end = document.cookie.indexOf(";", offset);

                    if (end == -1) {
                        end = document.cookie.length;
                    }

                    returnvalue = unescape(
                        document.cookie.substring(offset, end)
                    );
                }
            }

            return returnvalue;
        }

        function loadpopup(inDir) {
            if (get_cookie("popped") == "") {
                openpopup(inDir);
                document.cookie = "popped=yes";
            }
        }
        
    </script>
    
</head>

<body bgcolor="white"
      leftmargin="0"
      marginheight="0"
      marginwidth="0"
      topmargin="0">
