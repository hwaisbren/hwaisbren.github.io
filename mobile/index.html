
<html>
<head>
<title>My November</title>
 <style>
        body {
           
            font-family: Arial, Helvetica, sans-serif; 
        }
       
        html {
  scroll-behavior: smooth;
}

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        
        .container {
            display: grid;
            /* Combines a 100px base height with the iPhone safe area notch padding */
             grid-template-rows: 100px 1fr;
            height: 100dvh;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block; 
        }
        
        /* Adds the physical padding into the top frame container */
        .top-frame {
  /* Apply safe area padding and push the iframe down internally */
  padding-top: env(safe-area-inset-top);
  height: calc(100px + env(safe-area-inset-top));
  background-color: #ffffff;
}

    </style>
<script>
    const isMobileDevice =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    const isSmallScreen =
        window.innerWidth <= 600;

    if (!(isMobileDevice || isSmallScreen)) {
        window.location.replace("../index.html");
    }
</script>

    <div class="container">
        <div class="top-frame">
            <iframe src="titleframe.html" name="top"></iframe>
        </div>
        <div class="content-frame">
            <iframe src="home_content.html" name="content"></iframe>
        </div>
    </div>

</head>
</html>
