
<html>
<head>
<title>My November</title>
 <style>
        body {
           
            font-family: Arial, Helvetica, sans-serif; 
        }
       
        html {
  scroll-behavior: smooth;
}

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        
        .container {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100%;
}

.top-frame {
  padding-top: env(safe-area-inset-top);
  /* Hardcodes the explicit container height including the notch */
  height: calc(100px + env(safe-area-inset-top));
  flex-shrink: 0; /* Prevents the content frame from squishing the top bar */
  background-color: #ffffff;
  position: relative;
  z-index: 10; 
}

.content-frame {
  flex-grow: 1;
  min-height: 0; /* Critical for iOS: forces the frame to stay within bounds */
  position: relative;
  z-index: 1;
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block; /* Removes inline spacing gaps */
}

    </style>
<script>
    const isMobileDevice =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    const isSmallScreen =
        window.innerWidth <= 600;

    if (!(isMobileDevice || isSmallScreen)) {
        window.location.replace("../index.html");
    }
</script>

    <div class="container">
        <div class="top-frame">
            <iframe src="titleframe.html" name="top"></iframe>
        </div>
        <div class="content-frame">
            <iframe src="home_content.html" name="content"></iframe>
        </div>
    </div>

</head>
</html>
